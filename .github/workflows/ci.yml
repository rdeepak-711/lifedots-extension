name: extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the built package is loadable
        run: node tools/check-package.mjs

      - name: Upload the built extension
        uses: actions/upload-artifact@v7
        with:
          name: lifedots-unpacked
          path: dist
          if-no-files-found: error
